; dws_input.ini -- DWS Input: one config for winmm.dll, dinput.dll and dinput8.dll.
; Place next to whichever proxy DLL(s) you use, in the game folder.
; Every key is optional; values shown are the built-in defaults.
;
; HOW SECTIONS WORK
;   [General] [Input] [Buttons] [Rumble]  shared by every DLL.
;   [Axes.WinMM]    axis mapping for winmm.dll    (axes: X, Y, Z, R, U, V)
;   [Axes.DInput]   axis mapping for dinput.dll AND dinput8.dll (axes: X, Y, Z, Rx, Ry, Rz)
;   [WinMM] [DInput] [DInput8]   per-DLL overrides. Any key from any shared
;                   section may be placed here and then applies to that DLL only.
;                   (Example below: winmm.dll uses DPadAsStick=Left, the others None.)
;
; Logs: dws_input_winmm.log / dws_input_dinput.log / dws_input_dinput8.log
;       (one per DLL, written next to the DLL when Log=1).

[General]
; 1 = write the log file, 0 = no log file.
Log=0
; 1 = real joystick/gamepad devices are hidden from the game so only the SDL
;     pad is seen (keyboard and mouse are never touched). For winmm.dll this
;     reports the real winmm joystick IDs as unplugged.
; 0 = real devices stay visible alongside the SDL pad.
HideRealPads=1
; Report the virtual pad even when no controller is connected (for controller hotplugging).
; Neutral (centered, no buttons) is reported until a pad shows up.
AlwaysPresent=1
; Which SDL gamepad to use (0 = first). Falls back to 0 if out of range.
PadIndex=0
; Name/IDs the game sees for the device.
ProductName=SDL Gamepad
VendorID=045E
ProductID=028E

[Input]
; Deadzone applied to stick axes, percent (0-90).
StickDeadzone=8
; How far a trigger must be pulled (percent) to count as a button press,
; when a trigger is assigned to a button slot.
TriggerThreshold=30
; 1 = d-pad is reported as the POV hat. 0 = no POV hat; map the d-pad to
; buttons below (DPadUp/DPadDown/DPadLeft/DPadRight) instead.
DPadAsPOV=1
; Make the d-pad move like an analog stick: None, Left or Right.
; While a d-pad direction is held it overrides that stick's axis with full
; deflection; the physical stick still works when the d-pad is idle.
; Independent of DPadAsPOV (set DPadAsPOV=0 if the game should only see the stick).
DPadAsStick=None

; ---------------------------------------------------------------------------
; Axis sources: LeftX LeftY RightX RightY LeftTrigger RightTrigger None
;               Triggers   (combined: left trigger one way, right trigger the other,
;                           like an Xbox 360 pad through winmm / DirectInput)
; InvertN=1 flips axis N.
; ---------------------------------------------------------------------------

; winmm.dll reports 6 axes in this order: X, Y, Z, R, U, V  (Axis0..Axis5).
; Defaults mirror an Xbox 360 pad under winmm: Z = triggers, R = right stick Y, U = right stick X.
[Axes.WinMM]
Axis0=LeftX
Axis1=LeftY
Axis2=Triggers
Axis3=RightY
Axis4=RightX
Axis5=None
Invert0=0
Invert1=0
Invert2=0
Invert3=0
Invert4=0
Invert5=0

; dinput.dll and dinput8.dll report 6 axes in DirectInput order: X, Y, Z, Rx, Ry, Rz.
[Axes.DInput]
Axis0=LeftX
Axis1=LeftY
Axis2=RightX
Axis3=None
Axis4=None
Axis5=RightY
Invert0=0
Invert1=0
Invert2=0
Invert3=0
Invert4=0
Invert5=0

; Up to 32 buttons (Button0..Button31). The game sees them as button 1..N.
; Sources: A B X Y Back Start Guide LeftStick RightStick LeftShoulder
;          RightShoulder DPadUp DPadDown DPadLeft DPadRight Misc1 Touchpad
;          LeftTrigger RightTrigger (trigger as a button, see TriggerThreshold)
;          None
; A/B/X/Y are by Xbox position: A = bottom face button, B = right, X = left,
; Y = top (so on PlayStation pads A = Cross, B = Circle, X = Square, Y = Triangle).
; ButtonCount: 0 = automatic (highest assigned button), otherwise forced.
[Buttons]
ButtonCount=0
Button0=A
Button1=B
Button2=X
Button3=Y
Button4=LeftShoulder
Button5=RightShoulder
Button6=LeftTrigger
Button7=RightTrigger
Button8=Back
Button9=Start
Button10=LeftStick
Button11=RightStick
; Examples for extra slots:
;Button12=Guide
;Button13=Touchpad

; Force feedback. Used by dinput.dll and dinput8.dll (winmm has no force feedback API).
[Rumble]
; 0 = don't advertise force feedback to the game at all.
Enabled=1
; Overall strength and per-motor weight, percent (0-200, capped at full power).
Strength=100
LowMotor=100
HighMotor=100

; ===========================================================================
; Per-DLL overrides. Anything set here beats the shared sections above, for
; that one DLL only.
; ===========================================================================

[WinMM]
; Which winmm joystick ID (uJoyID, 0-15) the SDL pad answers on. 0 = JOYSTICKID1.
JoystickID=0
; winmm.dll has always defaulted to the d-pad also driving the left stick.
DPadAsStick=Left

[DInput]
; (nothing overridden)

[DInput8]
; (nothing overridden)
; Example: give only dinput8.dll a different dead zone.
;StickDeadzone=12
